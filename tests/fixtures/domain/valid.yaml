apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata: {name: valid}
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: first
            template: run
          - name: second
            template: run
            depends: first.Succeeded || first.Failed
    - name: run
      container: {image: alpine}
