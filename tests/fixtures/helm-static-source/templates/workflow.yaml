apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: {{ .Release.Name | quote }}
  namespace: argo
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: message
        value: {{ .Values.message | quote }}
  templates:
    - name: main
      steps:
        - - name: call-library
            templateRef:
              name: helm-library
              template: render
            arguments:
              parameters:
                - name: message
                  value: "{{ `{{workflow.parameters.message}}` }}"
