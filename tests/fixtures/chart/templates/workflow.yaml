apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    kube-version: "{{ .Capabilities.KubeVersion.Version }}"
spec:
  parallelism: {{ .Values.parallelism }}
  entrypoint: main
  templates:
    - name: main
      container:
        image: alpine
