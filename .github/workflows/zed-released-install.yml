name: Published Zed adapter installation
permissions:
  contents: read
  actions: read
jobs:
  install:
    name: Exact published file installation (${{ matrix.runner }})
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - macos-15
        - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Validate publication identity and exact immutable tag
      id: release
      env:
        GH_TOKEN: ${{ github.token }}
      run: python editors/zed/tests/released_identity.py
    - name: Install exact published version and verify source manifest
      run: python editors/zed/tests/install_e2e.py --version "${{ steps.release.outputs.version }}" --source-commit "${{ steps.release.outputs.source }}"
        --report artifacts/released-install/files
    - name: Retain publication and file installation evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: released-install-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/released-install/
        if-no-files-found: error
  acceptance:
    name: Published installation aggregate
    if: always()
    needs:
    - install
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
    - name: Collect current installation evidence
      if: needs.install.result == 'success'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: released-install-*-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/installed
    - name: Require all published-source installations or record the upstream failure
      env:
        INSTALL_RESULT: ${{ needs.install.result }}
      run: |-
        python - <<'PY_GATE'
        import json, os
        from pathlib import Path
        upstream = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['workflow_run']
        report = {'schemaVersion': 1, 'upstreamRunID': upstream['id'], 'upstreamAttempt': upstream['run_attempt'], 'sourceCommit': upstream['head_sha'], 'upstreamConclusion': upstream['conclusion'], 'installationResult': os.environ['INSTALL_RESULT'], 'pass': False, 'hostAcceptance': 'not-executed'}
        try:
            if upstream['conclusion'] != 'success':
                report['state'] = 'not-executed-upstream-' + str(upstream['conclusion'])
                raise ValueError('Upstream publication did not succeed; installation was not executed')
            if os.environ['INSTALL_RESULT'] != 'success':
                raise ValueError('Successful publication requires every installation; skip/cancel/failure is not acceptance')
            roots = list(Path('artifacts/installed').glob('released-install-*'))
            expected = {'ubuntu-24.04', 'macos-15', 'windows-2025'}
            observed = set()
            for root in roots:
                platform = next((value for value in expected if root.name.startswith('released-install-' + value + '-')), None)
                if platform is None or platform in observed:
                    raise ValueError('Unexpected or duplicate installation platform')
                observed.add(platform)
                identity = json.loads((root / 'release-identity.json').read_text())
                files = json.loads((root / 'files/report.json').read_text())
                if identity['sourceCommit'] != upstream['head_sha'] or identity['runID'] != upstream['id'] or identity['attempt'] != upstream['run_attempt'] or files.get('sourceCommit') != upstream['head_sha'] or files.get('passed') is not True:
                    raise ValueError('Installation evidence differs from published source and attempt')
            if observed != expected:
                raise ValueError('Missing installation platform evidence')
            report.update(state='published-files-verified', platforms=sorted(observed), **{'pass': True})
        except Exception as error:
            report['error'] = str(error)
        finally:
            Path('artifacts').mkdir(exist_ok=True)
            Path('artifacts/published-install-gate.json').write_text(json.dumps(report, indent=2) + '\n')
        raise SystemExit(0 if report['pass'] else 1)
        PY_GATE
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: published-install-gate-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/published-install-gate.json
        if-no-files-found: error
'on':
  workflow_run:
    workflows:
    - Release independent Zed adapter
    types:
    - completed
