name: Zed alpha installer E2E (filesystem only)
permissions:
  contents: read
jobs:
  selection:
    name: Classify complete source changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.selection }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - id: plan
      run: |-
        python tests/ci/control.py plan --workflow install --output artifacts/install-plan.json
        python -c "import json,os;open(os.environ['GITHUB_OUTPUT'],'a').write('selection='+json.load(open('artifacts/install-plan.json'))['selection']+'\n')"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: install-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/install-plan.json
        if-no-files-found: error
  docs:
    name: Validate selection and documentation
    needs:
    - selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Verify real Git selection and refusal behavior
      run: python tests/ci/selection_e2e.py --output artifacts/selection-e2e
    - name: Validate selected documentation with raw evidence
      if: needs.selection.outputs.mode == 'docs'
      run: |-
        python tests/ci/control.py plan --workflow install --output artifacts/install-plan.json
        python tests/ci/control.py start --output artifacts/docs-start.json
        python tests/ci/control.py docs --plan artifacts/install-plan.json --output artifacts/docs-check
        python tests/ci/control.py receipt --plan artifacts/install-plan.json --lane docs --started artifacts/docs-start.json --evidence artifacts/docs-check --output artifacts/docs-receipt/docs.json
    - if: needs.selection.outputs.mode == 'docs'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: install-receipt-docs-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/docs-receipt/
        if-no-files-found: error
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: install-selection-controls-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/selection-e2e/
        if-no-files-found: error
    - if: always() && needs.selection.outputs.mode == 'docs'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: install-docs-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          artifacts/docs-check/
          artifacts/install-plan.json
          artifacts/docs-start.json
        if-no-files-found: error
  install:
    name: Real Release file-install E2E (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - macos-15
        - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Bind fresh job execution
      shell: bash
      working-directory: .
      run: |-
        python tests/ci/control.py start --output artifacts/lane-start.json
        python tests/ci/control.py plan --workflow install --output artifacts/install-plan.json
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Install, replace, roll back and fault-inject using the published alpha.4 fixture
      shell: bash
      run: python editors/zed/tests/install_e2e.py --version 0.0.1-alpha.4 --report artifacts/zed-installer
    - name: Retain file-install evidence (not a Zed GUI test)
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: zed-installer-${{ matrix.runner }}
        path: artifacts/zed-installer/
        if-no-files-found: ignore
        retention-days: 30
    - name: Record exact selected lane evidence
      shell: bash
      run: python tests/ci/control.py receipt --plan artifacts/install-plan.json --lane "install-${{ matrix.runner }}" --started artifacts/lane-start.json
        --evidence artifacts/zed-installer --output artifacts/receipt/install-${{ matrix.runner }}.json
      working-directory: .
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: install-receipt-install-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/receipt/
        if-no-files-found: error
        compression-level: 0
    needs:
    - selection
    if: needs.selection.outputs.mode == 'full'
  acceptance:
    name: ${{ github.event_name == 'pull_request' && 'Installer acceptance gate' || format('Installer acceptance gate ({0})', github.event_name) }}
    if: always()
    needs:
    - install
    - selection
    - docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: install-receipt-*-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/receipts
    - name: Require current plan, every lane and successful dependencies
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |-
        python tests/ci/control.py plan --workflow install --output artifacts/install-plan.json
        python tests/ci/control.py gate --plan artifacts/install-plan.json --receipts artifacts/receipts --output artifacts/gate.json
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: install-gate-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/gate.json
        if-no-files-found: error
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
