name: Native LSP acceptance and distribution
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOWORK: 'off'
  GOTOOLCHAIN: local
  CGO_ENABLED: '1'
  GOFLAGS: ''
  GOPROXY: 'off'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  MACOSX_DEPLOYMENT_TARGET: '13.0'
jobs:
  prepare:
    name: Resolve exact candidate source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
    - name: Validate the independent LSP VERSION and clean source
      id: version
      env:
        REQUESTED_VERSION: ${{ inputs.release_version }}
        SOURCE_COMMIT: ${{ github.sha }}
      run: python scripts/release.py version --source-commit "$SOURCE_COMMIT" --requested-version "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
  native-build:
    needs: prepare
    name: Native build / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          platform: linux/amd64
          artifact: linux-amd64
          binary: argo-workflows-ls
          cc: gcc-13
        - runner: ubuntu-24.04-arm
          platform: linux/arm64
          artifact: linux-arm64
          binary: argo-workflows-ls
          cc: gcc-13
        - runner: macos-15-intel
          platform: darwin/amd64
          artifact: darwin-amd64
          binary: argo-workflows-ls
          cc: clang
        - runner: macos-15
          platform: darwin/arm64
          artifact: darwin-arm64
          binary: argo-workflows-ls
          cc: clang
        - runner: windows-2025
          platform: windows/amd64
          artifact: windows-amd64
          binary: argo-workflows-ls.exe
          cc: gcc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
    - name: Bind the compilation cache to the native compiler and runner image
      run: python tests/ci/run.py cache-identity --output artifacts/ci/cache
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        check-latest: false
        cache: true
        cache-dependency-path: |
          go.mod
          go.sum
          vendor/modules.txt
          artifacts/ci/cache/identity.json
    - name: Reject incomplete version shards and fabricated success evidence
      run: python -m unittest discover -s tests/ci -p 'test_*.py' -v
    - name: Build actual native server and record source/toolchain identity
      id: build
      run: python tests/ci/run.py build --platform "${{ matrix.platform }}" --release-version "${{ needs.prepare.outputs.version }}" --output artifacts/ci/build
    - name: Bind one verified native binary to its consumer lanes
      run: python tests/ci/build_artifact.py pack --build artifacts/ci/build/build.json --source-commit "${{ github.sha }}" --version "${{ needs.prepare.outputs.version }}" --platform "${{ matrix.platform }}" --output artifacts/native-build
    - name: Retain the same-run native build for both lanes
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-build-${{ matrix.artifact }}
        path: artifacts/native-build/
        compression-level: 0
        if-no-files-found: error
        retention-days: 30
    - name: Retain the independent producer identity for the aggregate gate
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-producer-${{ matrix.artifact }}
        path: artifacts/native-build/producer.json
        if-no-files-found: error
        retention-days: 30
    - name: Archive partial producer evidence after a failure
      id: evidence
      if: failure()
      run: python tests/ci/evidence.py pack --root artifacts/ci --output artifacts/ci-evidence
    - name: Retain failed producer evidence
      if: ${{ always() && steps.evidence.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-build-failure-${{ matrix.artifact }}-${{ github.sha }}
        path: artifacts/ci-evidence/
        compression-level: 0
        if-no-files-found: error
        retention-days: 30
  native:
    needs:
    - prepare
    - native-build
    name: Native / ${{ matrix.target.platform }} / lane ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [0, 1]
        target:
        - runner: ubuntu-24.04
          platform: linux/amd64
          artifact: linux-amd64
          binary: argo-workflows-ls
          cc: gcc-13
        - runner: ubuntu-24.04-arm
          platform: linux/arm64
          artifact: linux-arm64
          binary: argo-workflows-ls
          cc: gcc-13
        - runner: macos-15-intel
          platform: darwin/amd64
          artifact: darwin-amd64
          binary: argo-workflows-ls
          cc: clang
        - runner: macos-15
          platform: darwin/arm64
          artifact: darwin-arm64
          binary: argo-workflows-ls
          cc: clang
        - runner: windows-2025
          platform: windows/amd64
          artifact: windows-amd64
          binary: argo-workflows-ls.exe
          cc: gcc
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 35
    env:
      CC: ${{ matrix.target.cc }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
    - name: Bind the compilation cache to the native compiler and runner image
      run: python tests/ci/run.py cache-identity --output artifacts/ci/cache
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        check-latest: false
        cache: true
        cache-dependency-path: |
          go.mod
          go.sum
          vendor/modules.txt
          artifacts/ci/cache/identity.json
    - name: Download only this run's exact platform producer
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: workflows-build-${{ matrix.target.artifact }}
        path: artifacts/native-build
    - name: Verify archive, source, native platform and executed binary identity
      id: restore
      run: python tests/ci/build_artifact.py restore --inputs artifacts/native-build --source-commit "${{ github.sha }}" --version "${{ needs.prepare.outputs.version }}" --platform "${{ matrix.target.platform }}" --output artifacts/ci/relocated
    - name: Race-check shared catalog lifecycle and file authority
      if: matrix.target.platform == 'linux/amd64' && matrix.lane == 0
      run: go test -mod=vendor -race -count=1 ./internal/analysis ./internal/assets ./internal/lsp ./internal/workspace
    - name: Execute CLI and stdio LSP semantic consumers
      if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
      run: python tests/ci/run.py suite --suite native --shard ${{ matrix.lane }}/2 --producer artifacts/native-build/producer.json --binary artifacts/ci/build/${{ matrix.target.binary }} --output artifacts/ci/native
    - name: Generate and validate the editor-independent native archive
      id: package
      if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.lane == 0 }}
      run: python tests/ci/run.py package --binary artifacts/ci/build/${{ matrix.target.binary }} --output artifacts/ci/package
    - name: Verify native release staging and aggregate refusal controls
      if: ${{ !cancelled() && steps.restore.outcome == 'success' && matrix.lane == 0 }}
      run: python tests/e2e/release-distribution.py --platform "${{ matrix.target.platform }}" --output artifacts/ci/release-e2e
    - name: Prove native release works without any editor checkout
      if: matrix.target.platform == 'linux/amd64' && matrix.lane == 0
      run: python tests/native_isolation.py --output artifacts/native-isolation
    - name: Ablate version compatibility mechanisms against real consumers
      if: matrix.target.platform == 'linux/amd64' && matrix.lane == 0
      run: python tests/e2e/wf-multi-version-ablation.py artifacts/ci/build/argo-workflows-ls artifacts/ci/multi-version-ablation
    - name: Stage exact native release assets
      if: matrix.lane == 0
      run: python scripts/release.py stage --build artifacts/ci/relocated/build.json --version "${{ needs.prepare.outputs.version }}" --source-commit "${{ github.sha }}" --output artifacts/ci/release-assets
    - name: Retain per-platform release assets
      if: matrix.lane == 0
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-release-${{ matrix.target.artifact }}
        path: artifacts/ci/release-assets/
        if-no-files-found: error
        retention-days: 30
    - name: Retain the exact lane coverage receipt
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-coverage-${{ matrix.target.artifact }}-${{ matrix.lane }}
        path: artifacts/ci/native/native-lane.json
        if-no-files-found: error
        retention-days: 30
    - name: Archive and verify complete native evidence
      id: evidence
      if: always()
      run: python tests/ci/evidence.py pack --root artifacts/ci --optional-root artifacts/native-isolation --output artifacts/ci-evidence
    - name: Retain native logs, failed fixtures and packages
      if: ${{ always() && steps.evidence.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-native-${{ matrix.target.artifact }}-${{ matrix.lane }}-${{ github.sha }}
        path: artifacts/ci-evidence/
        compression-level: 0
        if-no-files-found: error
        retention-days: 30
  extended:
    needs: prepare
    name: Linux semantic / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
    env:
      CC: gcc-13
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
    - name: Bind the compilation cache to the native compiler and runner image
      run: python tests/ci/run.py cache-identity --output artifacts/ci/cache
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        check-latest: false
        cache: true
        cache-dependency-path: |
          go.mod
          go.sum
          vendor/modules.txt
          artifacts/ci/cache/identity.json
    - name: Build actual native server
      id: build
      run: python tests/ci/run.py build --platform linux/amd64 --release-version "${{ needs.prepare.outputs.version }}" --output artifacts/ci/build
    - name: Install checksum-pinned offline oracle tools
      run: python tests/ci/install-tools.py --output artifacts/ci/tools
    - name: Execute extended existing consumers
      run: python tests/ci/run.py suite --suite extended --shard ${{ matrix.shard }}/3 --tools artifacts/ci/tools --binary artifacts/ci/build/argo-workflows-ls --output artifacts/ci/extended
    - name: Verify actual and synthetic schema query boundaries separately
      if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 0 }}
      run: python tests/ci/run.py schema --binary artifacts/ci/build/argo-workflows-ls --output artifacts/ci/schema
    - name: Archive and verify complete semantic evidence
      id: evidence
      if: always()
      run: python tests/ci/evidence.py pack --root artifacts/ci --output artifacts/ci-evidence
    - name: Retain semantic evidence including failed runs
      if: ${{ always() && steps.evidence.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-semantic-${{ matrix.shard }}-${{ github.sha }}
        path: artifacts/ci-evidence/
        compression-level: 0
        if-no-files-found: error
        retention-days: 30
  resources:
    needs: prepare
    name: Linux resources / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
        - adversarial
        - load
        - index
    env:
      CC: gcc-13
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
    - name: Bind the compilation cache to the native compiler and runner image
      run: python tests/ci/run.py cache-identity --output artifacts/ci/cache
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        check-latest: false
        cache: true
        cache-dependency-path: |
          go.mod
          go.sum
          vendor/modules.txt
          artifacts/ci/cache/identity.json
    - name: Build outside measured cgroups
      run: python tests/ci/run.py build --platform linux/amd64 --release-version "${{ needs.prepare.outputs.version }}" --output artifacts/ci/build
    - name: Execute existing consumers with enforced CPU, memory and swap limits
      run: python tests/ci/resources.py --suite ${{ matrix.suite }} --binary artifacts/ci/build/argo-workflows-ls --output artifacts/ci/resources
    - name: Archive and verify complete resource evidence
      id: evidence
      if: always()
      run: python tests/ci/evidence.py pack --root artifacts/ci --output artifacts/ci-evidence
    - name: Retain resource measurements, limits, raw traffic and failed inputs
      if: ${{ always() && steps.evidence.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-resources-${{ matrix.suite }}-${{ github.sha }}
        path: artifacts/ci-evidence/
        compression-level: 0
        if-no-files-found: error
        retention-days: 30
  mutations:
    name: Mutation gate / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
        - core
        - audit
        - resources
    env:
      CC: gcc-13
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
    - name: Bind the compilation cache to the native compiler and runner image
      run: python tests/ci/run.py cache-identity --output artifacts/ci/cache
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        check-latest: false
        cache: true
        cache-dependency-path: |
          go.mod
          go.sum
          vendor/modules.txt
          artifacts/ci/cache/identity.json
    - name: Require passing baselines and specific semantic mutation detection
      run: python tests/ci/run.py mutations --group ${{ matrix.group }} --output artifacts/ci/mutations
    - name: Archive and verify complete mutation evidence
      id: evidence
      if: always()
      run: python tests/ci/evidence.py pack --root artifacts/ci --output artifacts/ci-evidence
    - name: Retain mutation diffs, binaries, baseline and mutant evidence
      if: ${{ always() && steps.evidence.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-mutations-${{ matrix.group }}-${{ github.sha }}
        path: artifacts/ci-evidence/
        compression-level: 0
        if-no-files-found: error
        retention-days: 30
  acceptance:
    name: Acceptance gate
    if: always()
    needs:
    - prepare
    - native-build
    - native
    - extended
    - resources
    - mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
    - name: Require every platform and mandatory gate
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        expected = {'prepare', 'native-build', 'native', 'extended', 'resources', 'mutations'}
        failures = {name: result['result'] for name, result in results.items() if result['result'] != 'success'}
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
            out.write('## Automated acceptance\n\n')
            for name, result in results.items():
                out.write(f"- {name}: {result['result']}\n")
            out.write('\nReal Zed editor acceptance: **not executed by this workflow**.\n')
        if set(results) != expected or failures:
            raise SystemExit('Mandatory checks did not all succeed: ' + json.dumps(failures))
        PY
    - name: Download independent producer receipts from this run
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: workflows-producer-*
        path: artifacts/coverage-inputs
    - name: Download both consumer-lane receipts from this run
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: workflows-coverage-*
        path: artifacts/coverage-inputs
    - name: Reject missing, duplicated or source-mismatched native coverage
      run: python tests/ci/native_shards.py verify --inputs artifacts/coverage-inputs --source-commit "${{ github.sha }}" --version "${{ needs.prepare.outputs.version }}" --output artifacts/coverage-gate
    - name: Retain the complete coverage decision
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-native-coverage-${{ github.sha }}
        path: artifacts/coverage-gate/
        if-no-files-found: error
        retention-days: 30
  candidate:
    name: Verify complete native distribution
    needs:
    - prepare
    - acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
    - name: Download native assets from this exact workflow run
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: workflows-release-*
        path: artifacts/candidate-inputs/native
    - name: Verify all native platforms, original licenses, source identity and checksums
      run: python scripts/release.py collect --inputs artifacts/candidate-inputs/native --version "${{ needs.prepare.outputs.version }}" --source-commit "${{ github.sha }}" --output artifacts/native-distribution
    - name: Retain the complete verified native distribution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-native-distribution-${{ needs.prepare.outputs.version }}-${{ github.sha }}
        path: artifacts/native-distribution/
        if-no-files-found: error
        retention-days: 30
    - name: Summarize the native acceptance boundary
      run: 'cat >> "$GITHUB_STEP_SUMMARY" <<''EOF''

        ## Native LSP distribution verified


        Five native hosts executed CLI/LSP consumers and verified the exact source identity,

        original licenses, packaged bytes and SHA-256 inventories.

        The Zed adapter has its own workflow and release lifecycle.

        EOF'
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
  workflow_call:
    inputs:
      release_version:
        description: Exact independent LSP version (including alpha releases)
        type: string
        required: false
        default: ''
