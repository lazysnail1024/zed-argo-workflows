name: Native LSP acceptance and distribution
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOWORK: 'off'
  GOTOOLCHAIN: local
  CGO_ENABLED: '1'
  GOFLAGS: ''
  GOPROXY: 'off'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  MACOSX_DEPLOYMENT_TARGET: '13.0'
jobs:
  selection:
    name: Classify complete source changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.selection }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - id: plan
      run: |-
        python tests/ci/control.py plan --workflow native --output artifacts/native-plan.json
        python -c "import json,os;open(os.environ['GITHUB_OUTPUT'],'a').write('selection='+json.load(open('artifacts/native-plan.json'))['selection']+'\n')"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/native-plan.json
        if-no-files-found: error
  docs:
    name: Validate selection and documentation
    needs:
    - selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Verify real Git selection and refusal behavior
      run: python tests/ci/selection_e2e.py --output artifacts/selection-e2e
    - name: Validate selected documentation with raw evidence
      if: needs.selection.outputs.mode == 'docs'
      run: |-
        python tests/ci/control.py plan --workflow native --output artifacts/native-plan.json
        python tests/ci/control.py start --output artifacts/docs-start.json
        python tests/ci/control.py docs --plan artifacts/native-plan.json --output artifacts/docs-check
        python tests/ci/control.py receipt --plan artifacts/native-plan.json --lane docs --started artifacts/docs-start.json --evidence artifacts/docs-check --output artifacts/docs-receipt/docs.json
    - if: needs.selection.outputs.mode == 'docs'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-receipt-docs-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/docs-receipt/
        if-no-files-found: error
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-selection-controls-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/selection-e2e/
        if-no-files-found: error
    - if: always() && needs.selection.outputs.mode == 'docs'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-docs-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          artifacts/docs-check/
          artifacts/native-plan.json
          artifacts/docs-start.json
        if-no-files-found: error
  prepare:
    name: Resolve exact candidate source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Validate the independent LSP VERSION and clean source
      id: version
      env:
        REQUESTED_VERSION: ${{ inputs.release_version }}
        SOURCE_COMMIT: ${{ github.sha }}
      run: python scripts/release.py version --source-commit "$SOURCE_COMMIT" --requested-version "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
  native:
    needs:
    - prepare
    - ordinary
    - selection
    name: Native / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          platform: linux/amd64
          artifact: linux-amd64
          binary: argo-workflows-ls
          cc: gcc-13
        - runner: ubuntu-24.04-arm
          platform: linux/arm64
          artifact: linux-arm64
          binary: argo-workflows-ls
          cc: gcc-13
        - runner: macos-15-intel
          platform: darwin/amd64
          artifact: darwin-amd64
          binary: argo-workflows-ls
          cc: clang
        - runner: macos-15
          platform: darwin/arm64
          artifact: darwin-arm64
          binary: argo-workflows-ls
          cc: clang
        - runner: windows-2025
          platform: windows/amd64
          artifact: windows-amd64
          binary: argo-workflows-ls.exe
          cc: gcc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CC: ${{ matrix.cc }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Fix full execution plan
      run: python tests/ci/control.py plan --workflow native --output artifacts/native-plan.json
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        check-latest: false
        cache: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Reject incomplete version shards and fabricated success evidence
      run: |-
        python -m unittest discover -s tests/ci -p 'test_*.py' -v
        python tests/ci/control_e2e.py --output artifacts/ci/control-e2e
        python tests/ci/receipt_e2e.py --output artifacts/ci/receipt-e2e
        python tests/e2e/session_e2e.py --output artifacts/ci/session-e2e
        python tests/ci/trends_e2e.py --output artifacts/ci/trends-e2e
    - name: Build actual native server and record source/toolchain identity
      id: build
      run: python tests/ci/run.py build --platform "${{ matrix.platform }}" --release-version "${{ needs.prepare.outputs.version }}" --output artifacts/ci/build
      if: matrix.platform != 'linux/amd64'
    - name: Download same-attempt ordinary bytes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ordinary-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/ci/build
      if: matrix.platform == 'linux/amd64'
    - name: Verify exact producer before starting any consumer
      id: import
      run: python tests/ci/run.py import-build --binary artifacts/ci/build/argo-workflows-ls --manifest artifacts/ci/build/build.json --manifest-sha256
        "${{ needs.ordinary.outputs.manifest }}" --release-version "${{ needs.prepare.outputs.version }}" --platform linux/amd64 --output artifacts/ci/import
      if: matrix.platform == 'linux/amd64'
    - name: Race-check shared catalog lifecycle and file authority
      if: matrix.platform == 'linux/amd64'
      run: go test -mod=vendor -race -count=1 ./internal/analysis ./internal/assets ./internal/lsp ./internal/workspace
    - name: Exercise real child evidence and transparent proxy counterexamples
      if: matrix.platform == 'linux/amd64'
      run: |-
        python tests/ci/material_effectiveness_e2e.py --binary artifacts/ci/build/argo-workflows-ls --output artifacts/ci/material-controls
        python tests/ci/oracle_effectiveness_e2e.py --binary artifacts/ci/build/argo-workflows-ls --output artifacts/ci/oracle-controls
    - name: Execute CLI and stdio LSP semantic consumers
      if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.import.outcome == 'success') }}
      run: python tests/ci/run.py suite --suite native --binary artifacts/ci/build/${{ matrix.binary }} --output artifacts/ci/native
    - name: Verify aggregate portability with original native reports
      if: matrix.platform == 'linux/amd64'
      run: python tests/ci/portability_e2e.py --native artifacts/ci/native --output artifacts/ci/portability-e2e
    - name: Verify relocated original native lane evidence
      if: matrix.platform == 'linux/amd64'
      run: python tests/ci/archive_e2e.py --evidence artifacts/ci --output artifacts/archive-e2e
    - name: Generate and validate the editor-independent native archive
      id: package
      if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.import.outcome == 'success') }}
      run: python tests/ci/run.py package --binary artifacts/ci/build/${{ matrix.binary }} --output artifacts/ci/package
    - name: Verify native release staging and aggregate refusal controls
      if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.import.outcome == 'success') }}
      run: python tests/e2e/release-distribution.py --platform "${{ matrix.platform }}" --output artifacts/ci/release-e2e
    - name: Prove native release works without any editor checkout
      if: matrix.platform == 'linux/amd64'
      run: python tests/native_isolation.py --output artifacts/ci/native-isolation
    - name: Validate shipped snippet bytes and their single-fault negative control
      if: matrix.platform == 'linux/amd64'
      run: python editors/zed/tests/ablate_snippets.py artifacts/ci/build/argo-workflows-ls artifacts/ci/snippet-contract
    - name: Ablate version compatibility mechanisms against real consumers
      if: matrix.platform == 'linux/amd64'
      run: python tests/e2e/wf-multi-version-ablation.py artifacts/ci/build/argo-workflows-ls artifacts/ci/multi-version-ablation
    - name: Stage exact native release assets
      run: python scripts/release.py stage --build artifacts/ci/build/build.json --version "${{ needs.prepare.outputs.version }}" --source-commit "${{ github.sha
        }}" --output artifacts/ci/release-assets
    - name: Retain separate CI timing observations
      if: always()
      run: python tests/ci/trends.py --inputs artifacts/ci/native/logs --output artifacts/ci/timings.json
    - name: Retain per-platform release assets
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-release-${{ matrix.artifact }}
        path: artifacts/ci/release-assets/
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Record exact selected lane evidence
      shell: bash
      run: python tests/ci/control.py receipt --plan artifacts/native-plan.json --lane "native-${{ matrix.artifact }}" --evidence artifacts/ci --move-payload --output
        artifacts/receipt/native-${{ matrix.artifact }}.json
    - name: Retain native logs, failed fixtures and packages
      if: ${{ failure() && hashFiles('artifacts/ci/**') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-native-${{ matrix.artifact }}-${{ github.sha }}
        path: artifacts/ci/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 6
    - if: ${{ always() && hashFiles('artifacts/receipt/**') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-receipt-native-${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/receipt/
        include-hidden-files: true
        retention-days: 30
        if-no-files-found: error
        compression-level: 6
    if: needs.selection.outputs.mode == 'full'
  extended:
    needs:
    - prepare
    - ordinary
    - selection
    name: Linux semantic / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
    env:
      CC: gcc-13
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Fix full execution plan
      run: python tests/ci/control.py plan --workflow native --output artifacts/native-plan.json
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Download same-attempt ordinary bytes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ordinary-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/ci/build
    - name: Verify exact producer before starting any consumer
      id: build
      run: python tests/ci/run.py import-build --binary artifacts/ci/build/argo-workflows-ls --manifest artifacts/ci/build/build.json --manifest-sha256
        "${{ needs.ordinary.outputs.manifest }}" --release-version "${{ needs.prepare.outputs.version }}" --platform linux/amd64 --output artifacts/ci/import
    - name: Install checksum-pinned offline oracle tools
      run: python tests/ci/install-tools.py --output artifacts/ci/tools
    - name: Execute extended existing consumers
      run: python tests/ci/run.py suite --suite extended --shard ${{ matrix.shard }}/3 --tools artifacts/ci/tools --binary artifacts/ci/build/argo-workflows-ls
        --output artifacts/ci/extended
    - name: Verify actual and synthetic schema query boundaries separately
      if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 0 }}
      run: python tests/ci/run.py schema --binary artifacts/ci/build/argo-workflows-ls --output artifacts/ci/schema
    - name: Retain separate CI timing observations
      if: always()
      run: python tests/ci/trends.py --inputs artifacts/ci/extended/logs --output artifacts/ci/timings.json
    - name: Record exact selected lane evidence
      shell: bash
      run: python tests/ci/control.py receipt --plan artifacts/native-plan.json --lane "extended-${{ matrix.shard }}" --evidence artifacts/ci --move-payload --output artifacts/receipt/extended-${{
        matrix.shard }}.json
    - name: Retain semantic evidence including failed runs
      if: ${{ failure() && hashFiles('artifacts/ci/**') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-semantic-${{ matrix.shard }}-${{ github.sha }}
        path: artifacts/ci/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 6
    - if: ${{ always() && hashFiles('artifacts/receipt/**') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-receipt-extended-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/receipt/
        include-hidden-files: true
        retention-days: 30
        if-no-files-found: error
        compression-level: 6
    if: needs.selection.outputs.mode == 'full'
  resources:
    needs:
    - prepare
    - ordinary
    - selection
    name: Linux resources / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
        - adversarial
        - load
        - index
        - queries
    env:
      CC: gcc-13
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Fix full execution plan
      run: python tests/ci/control.py plan --workflow native --output artifacts/native-plan.json
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Download same-attempt ordinary bytes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ordinary-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/ci/build
    - name: Verify exact producer before starting any consumer
      id: build
      run: python tests/ci/run.py import-build --binary artifacts/ci/build/argo-workflows-ls --manifest artifacts/ci/build/build.json --manifest-sha256
        "${{ needs.ordinary.outputs.manifest }}" --release-version "${{ needs.prepare.outputs.version }}" --platform linux/amd64 --output artifacts/ci/import
    - name: Execute existing consumers with enforced CPU, memory and swap limits
      run: python tests/ci/resources.py --suite ${{ matrix.suite }} --binary artifacts/ci/build/argo-workflows-ls --output artifacts/ci/resources
    - name: Retain separate CI timing observations
      if: always()
      run: python tests/ci/trends.py --inputs artifacts/ci/resources/logs --output artifacts/ci/timings.json
    - name: Record exact selected lane evidence
      shell: bash
      run: python tests/ci/control.py receipt --plan artifacts/native-plan.json --lane "resources-${{ matrix.suite }}" --evidence artifacts/ci --move-payload --output
        artifacts/receipt/resources-${{ matrix.suite }}.json
    - name: Retain resource measurements, limits, raw traffic and failed inputs
      if: ${{ failure() && hashFiles('artifacts/ci/**') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-resources-${{ matrix.suite }}-${{ github.sha }}
        path: artifacts/ci/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 6
    - if: ${{ always() && hashFiles('artifacts/receipt/**') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-receipt-resources-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/receipt/
        include-hidden-files: true
        retention-days: 30
        if-no-files-found: error
        compression-level: 6
    if: needs.selection.outputs.mode == 'full'
  mutations:
    name: Mutation gate / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
        - core
        - audit
        - contracts
        - legacy
        - resources
    env:
      CC: gcc-13
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Fix full execution plan
      run: python tests/ci/control.py plan --workflow native --output artifacts/native-plan.json
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Install checksum-pinned tools for integration contract controls
      if: matrix.group == 'contracts' || matrix.group == 'legacy'
      run: python tests/ci/install-tools.py --output artifacts/ci/tools
    - name: Require passing baselines and specific semantic mutation detection
      run: python tests/ci/run.py mutations --group ${{ matrix.group }} --output artifacts/ci/mutations --tools artifacts/ci/tools
    - name: Retain separate CI timing observations
      if: always()
      env:
        MUTATION_GROUP: ${{ matrix.group }}
      run: |-
        python - <<'PY_TIMINGS'
        import os, subprocess, sys
        from pathlib import Path
        names = ['driver']
        if os.environ['MUTATION_GROUP'] == 'audit':
            names += [name+'-driver' for name in ('shared-yaml-projection', 'catalog-queries', 'responsive-editing', 'shared-lifecycle')]
        for name in names:
            subprocess.run([sys.executable, 'tests/ci/trends.py', '--inputs', str(Path('artifacts/ci/mutations')/name), '--output', str(Path('artifacts/ci')/('timings-'+name+'.json'))], check=True)
        PY_TIMINGS
    - name: Record exact selected lane evidence
      shell: bash
      run: python tests/ci/control.py receipt --plan artifacts/native-plan.json --lane "mutations-${{ matrix.group }}" --evidence artifacts/ci --move-payload --output
        artifacts/receipt/mutations-${{ matrix.group }}.json
    - name: Retain mutation diffs, binaries, baseline and mutant evidence
      if: ${{ failure() && hashFiles('artifacts/ci/**') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-mutations-${{ matrix.group }}-${{ github.sha }}
        path: artifacts/ci/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
        compression-level: 6
    - if: ${{ always() && hashFiles('artifacts/receipt/**') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-receipt-mutations-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/receipt/
        include-hidden-files: true
        retention-days: 30
        if-no-files-found: error
        compression-level: 6
    needs:
    - selection
    if: needs.selection.outputs.mode == 'full'
  acceptance:
    name: ${{ github.event_name == 'pull_request' && 'Acceptance gate' || format('Acceptance gate ({0})', github.event_name) }}
    if: always()
    needs:
    - prepare
    - ordinary
    - native
    - extended
    - resources
    - mutations
    - candidate
    - selection
    - docs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: native-receipt-*-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/receipts
    - name: Require current plan, every lane and successful dependencies
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |-
        python tests/ci/control.py plan --workflow native --output artifacts/native-plan.json
        if [ "${{ needs.selection.outputs.mode }}" = full ]; then
          python tests/ci/downloaded_material_e2e.py --plan artifacts/native-plan.json --receipts artifacts/receipts --output artifacts/downloaded-material-controls
        fi
        python tests/ci/control.py gate --plan artifacts/native-plan.json --receipts artifacts/receipts --output artifacts/gate.json
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-gate-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          artifacts/gate.json
          artifacts/downloaded-material-controls/controls/
          artifacts/downloaded-material-controls/results.json
          artifacts/downloaded-material-controls/metrics.json
          artifacts/downloaded-material-controls/manifest.json
        if-no-files-found: error
        compression-level: 0
  candidate:
    name: Verify complete native distribution
    needs:
    - prepare
    - native
    - extended
    - resources
    - mutations
    - selection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Download native assets from this exact workflow run
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: workflows-release-*
        path: artifacts/candidate-inputs/native
    - name: Verify all native platforms, original licenses, source identity and checksums
      run: python scripts/release.py collect --inputs artifacts/candidate-inputs/native --version "${{ needs.prepare.outputs.version }}" --source-commit
        "${{ github.sha }}" --output artifacts/native-distribution
    - name: Retain the complete verified native distribution
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: workflows-native-distribution-${{ needs.prepare.outputs.version }}-${{ github.sha }}
        path: artifacts/native-distribution/
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Summarize the native acceptance boundary
      run: |-
        cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
        ## Native LSP distribution verified

        Five native hosts executed CLI/LSP consumers and verified the exact source identity,
        original licenses, packaged bytes and SHA-256 inventories.
        The Zed adapter has its own workflow and release lifecycle.
        EOF
    if: needs.selection.outputs.mode == 'full'
  ordinary:
    name: Produce ordinary Linux server
    needs:
    - prepare
    - selection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc-13
    outputs:
      manifest: ${{ steps.identity.outputs.manifest }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Record ordinary cache input identity
      shell: bash
      run: |-
        mkdir -p artifacts/cache
        python - <<'PY_CACHE'
        import json, os, subprocess
        from pathlib import Path
        record = {'compiler': subprocess.check_output([os.environ['CC'], '--version'], text=True), 'runnerImage': {key: os.environ.get(key) for key in ('ImageOS', 'ImageVersion')}, 'CGO_ENABLED': '1', 'GOFLAGS': '', 'buildMode': 'release', 'trimpath': True, 'moduleMode': 'vendor', 'MACOSX_DEPLOYMENT_TARGET': os.environ.get('MACOSX_DEPLOYMENT_TARGET')}
        Path('artifacts/cache/compiler.json').write_text(json.dumps(record, sort_keys=True))
        PY_CACHE
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: |-
          go.mod
          go.sum
          vendor/**/*
          artifacts/cache/compiler.json
          contracts/toolkit.lock.json
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.14.0
    - name: Build and test once outside all consumer measurements
      run: python tests/ci/run.py build --platform linux/amd64 --release-version "${{ needs.prepare.outputs.version }}" --output artifacts/ci/build
    - name: Bind producer manifest
      id: identity
      shell: bash
      run: |-
        python - <<'PY_ID'
        import hashlib, os
        from pathlib import Path
        with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
            stream.write('manifest='+hashlib.sha256(Path('artifacts/ci/build/build.json').read_bytes()).hexdigest()+'\n')
        PY_ID
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ordinary-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/ci/build/
        if-no-files-found: error
        compression-level: 0
    - name: Refuse substituted ordinary producers
      run: python tests/ci/import_e2e.py --build artifacts/ci/build --version "${{ needs.prepare.outputs.version }}" --output artifacts/ci/import-controls
    - if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ordinary-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/ci/build/
        if-no-files-found: error
        compression-level: 0
    if: needs.selection.outputs.mode == 'full'
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
  workflow_call:
    inputs:
      release_version:
        description: Exact independent LSP version (including alpha releases)
        type: string
        required: false
        default: ''
