name: Automated acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        description: Stable version for an exact clean native release build
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local
  CGO_ENABLED: '1'
  GOFLAGS: ''
  GOPROXY: 'off'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  prepare:
    name: Resolve exact candidate source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Validate clean source and matching stable manifests without requiring a tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: python scripts/candidate.py version --source-commit "$SOURCE_COMMIT" --requested-version "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

  native:
    needs: prepare
    name: Native / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
            binary: argo-workflows-ls
            cc: gcc-13
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: linux-arm64
            binary: argo-workflows-ls
            cc: gcc-13
          - runner: macos-15-intel
            platform: darwin/amd64
            artifact: darwin-amd64
            binary: argo-workflows-ls
            cc: clang
          - runner: macos-15
            platform: darwin/arm64
            artifact: darwin-arm64
            binary: argo-workflows-ls
            cc: clang
          - runner: windows-2025
            platform: windows/amd64
            artifact: windows-amd64
            binary: argo-workflows-ls.exe
            cc: gcc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Build actual native server and record source/toolchain identity
        id: build
        run: python tests/ci/run.py build --platform "${{ matrix.platform }}" --release-version "${{ needs.prepare.outputs.version }}" --output artifacts/ci/build
      - name: Execute CLI and stdio LSP semantic consumers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/ci/run.py suite --suite native --binary artifacts/ci/build/${{ matrix.binary }} --output artifacts/ci/native
      - name: Prepare pinned Rust and WASI toolchain
        id: rust
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-wasip2
      - name: Test installer lifecycle and override precedence
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo test --locked
      - name: Compile ordinary source extension to WASM
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: python tests/ci/run.py wasm --output artifacts/ci/wasm-source
      - name: Generate and validate development package on its native host
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/ci/run.py package --binary artifacts/ci/build/${{ matrix.binary }} --output artifacts/ci/package
      - name: Compile the standalone extension from the developer package
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.package.outcome == 'success' }}
        run: python tests/ci/run.py wasm --package artifacts/ci/package/package.json --output artifacts/ci/wasm-package
      - name: Verify native release staging and aggregate refusal controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tests/e2e/release-distribution.py --platform "${{ matrix.platform }}" --output artifacts/ci/release-e2e --wasm source=artifacts/ci/wasm-source/zed_argo_workflows.wasm --wasm developer-package=artifacts/ci/wasm-package/zed_argo_workflows.wasm
      - name: Stage exact native release assets
        run: python scripts/release.py stage --build artifacts/ci/build/build.json --version "${{ needs.prepare.outputs.version }}" --source-commit "${{ github.sha }}" --output artifacts/ci/release-assets
      - name: Validate and stage traceable adapter candidates without native payloads
        run: python scripts/candidate.py adapter --native-assets artifacts/ci/release-assets --platform "${{ matrix.platform }}" --version "${{ needs.prepare.outputs.version }}" --source-commit "${{ github.sha }}" --wasm source=artifacts/ci/wasm-source/zed_argo_workflows.wasm --wasm developer-package=artifacts/ci/wasm-package/zed_argo_workflows.wasm --output artifacts/ci/adapter-candidate
      - name: Retain adapter candidate inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflows-adapter-${{ matrix.artifact }}
          path: artifacts/ci/adapter-candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Retain per-platform release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflows-release-${{ matrix.artifact }}
          path: artifacts/ci/release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Retain native logs, failed fixtures, packages and both WASM outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflows-native-${{ matrix.artifact }}-${{ github.sha }}
          path: artifacts/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  extended:
    needs: prepare
    name: Linux semantic / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      CC: gcc-13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Build actual native server
        id: build
        run: python tests/ci/run.py build --platform linux/amd64 --release-version "${{ needs.prepare.outputs.version }}" --output artifacts/ci/build
      - name: Install checksum-pinned offline oracle tools
        run: python tests/ci/install-tools.py --output artifacts/ci/tools
      - name: Execute extended existing consumers
        run: python tests/ci/run.py suite --suite extended --shard ${{ matrix.shard }}/3 --tools artifacts/ci/tools --binary artifacts/ci/build/argo-workflows-ls --output artifacts/ci/extended
      - name: Verify actual and synthetic schema query boundaries separately
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.shard == 0 }}
        run: python tests/ci/run.py schema --binary artifacts/ci/build/argo-workflows-ls --output artifacts/ci/schema
      - name: Retain semantic evidence including failed runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflows-semantic-${{ matrix.shard }}-${{ github.sha }}
          path: artifacts/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  resources:
    needs: prepare
    name: Linux resources / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [adversarial, load]
    env:
      CC: gcc-13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Build outside measured cgroups
        run: python tests/ci/run.py build --platform linux/amd64 --release-version "${{ needs.prepare.outputs.version }}" --output artifacts/ci/build
      - name: Execute existing consumers with enforced CPU, memory and swap limits
        run: python tests/ci/resources.py --suite ${{ matrix.suite }} --binary artifacts/ci/build/argo-workflows-ls --output artifacts/ci/resources
      - name: Retain resource measurements, limits, raw traffic and failed inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflows-resources-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  mutations:
    name: Mutation gate / ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [core, audit, resources]
    env:
      CC: gcc-13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Require passing baselines and specific semantic mutation detection
        run: python tests/ci/run.py mutations --group ${{ matrix.group }} --output artifacts/ci/mutations
      - name: Retain mutation diffs, binaries, baseline and mutant evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflows-mutations-${{ matrix.group }}-${{ github.sha }}
          path: artifacts/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  acceptance:
    name: Acceptance gate
    if: always()
    needs: [native, extended, resources, mutations]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform and mandatory gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = {'native', 'extended', 'resources', 'mutations'}
          failures = {name: result['result'] for name, result in results.items() if result['result'] != 'success'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Automated acceptance\n\n')
              for name, result in results.items():
                  out.write(f"- {name}: {result['result']}\n")
              out.write('\nReal Zed editor acceptance: **not executed by this workflow**.\n')
          if set(results) != expected or failures:
              raise SystemExit('Mandatory checks did not all succeed: ' + json.dumps(failures))
          PY

  candidate:
    name: Verify complete distribution candidate (no publication)
    needs: [prepare, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Download native assets from this exact workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: workflows-release-*
          path: artifacts/candidate-inputs/native
      - name: Download corresponding adapter candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: workflows-adapter-*
          path: artifacts/candidate-inputs/adapters
      - name: Verify five real platforms, licenses, source identity and all SHA-256 inventories
        run: python scripts/candidate.py collect --native-inputs artifacts/candidate-inputs/native --adapter-inputs artifacts/candidate-inputs/adapters --version "${{ needs.prepare.outputs.version }}" --source-commit "${{ github.sha }}" --output artifacts/distribution-candidate
      - name: Retain validated candidate for review (not an installation channel)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflows-distribution-candidate-${{ needs.prepare.outputs.version }}-${{ github.sha }}
          path: artifacts/distribution-candidate/
          if-no-files-found: error
          retention-days: 30
      - name: State the remaining publication and editor gates
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Distribution candidate verified

          Five native release-mode builds and portable WASM adapter evidence belong to this exact commit.
          SHA-256 inventories, native legal archives and source identity passed the existing release collector.
          Actions artifacts expire after 30 days. No tag, GitHub Release or Zed store installation channel was created.
          Real Zed editor acceptance on all five platforms and official registry review remain required.
          EOF
