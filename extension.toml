id = "argo-workflows-lsp"
name = "Argo Workflows (local development)"
version = "0.1.0"
schema_version = 1
snippets = ["snippets/yaml.json"]
authors = ["snail (lazysnail1024)"]
repository = "https://github.com/lazysnail1024/zed-argo-workflows"
description = "Offline Argo Workflows 3.6.0 YAML support; other targets are experimental."

[language_servers.argo-workflows-ls]
name = "Argo Workflows Language Server"
languages = ["YAML"]
[language_servers.argo-workflows-ls.language_ids]
YAML = "yaml"

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["version", "--json"]
